[package]
name = "casper-executor-wasm"
version = "1.0.0"
edition = "2021"
authors = ["Michał Papierski <michal@casper.network>"]
description = "Casper executor wasm package"
homepage = "https://casper.network"
repository = "https://github.com/casper-network/casper-node/tree/dev/executor/wasm"
license = "Apache-2.0"

[dependencies]
blake2 = "0.10"
borsh = { version = "1.5", features = ["derive"] }
bytes = "1.10"
casper-contract-sdk = { version = "1.0.0", path = "../../smart_contracts/vm2/sdk" }
casper-executor-wasm-common = { version = "1.0.0", path = "../wasm_common" }
casper-executor-wasm-host = { version = "1.0.0", path = "../wasm_host" }
casper-executor-wasm-interface = { version = "1.0.0", path = "../wasm_interface" }
casper-executor-wasmer-backend = { version = "1.0.0", path = "../wasmer_backend" }
casper-storage = { version = "4.0.0", path = "../../storage" }
casper-types = { version = "8.0.0", path = "../../types", features = ["std"] }
casper-execution-engine = { version = "8.1.1", path = "../../execution_engine", features = [
    "test-support",
] }
digest = "0.10.7"
parking_lot = "0.12.1"
thiserror = "2.0"
tracing = "0.1.40"
base16 = "0.2.1"
log = "0.4.27"
serde = { version = "1.0.219", features = ["derive"] }
toml = "0.5.6"
num-rational = "0.4.2"

tempfile = { version = "3.10.1", optional = true }
once_cell = { version = "1.19.0", optional = true }
fs_extra = { version = "1.3.0", optional = true }
serde_json = { version = "1.0.127", optional = true }
itertools = { version = "0.14.0", optional = true }

[dev-dependencies]
casper-executor-wasm ={ path = "../wasm", features = ["testing"] }
casper-wasm = "1.0.0"

[features]
testing = ["tempfile", "once_cell", "fs_extra", "serde_json", "itertools"]
