[package]
name = "casper-contract-sdk"
version = "0.1.0"
edition = "2021"
authors = ["Michał Papierski <michal@casperlabs.io>"]

[dependencies]
borsh = { version = "1.5", features = ["derive"] }
bytes = "1.10"
bitflags = "2.9"
const-fnv1a-hash = "1.1.0"
impl-trait-for-tuples = "0.2.2"
casper-contract-sdk-sys = { version = "0.1.0", path = "../sdk_sys" }
casper-executor-wasm-common = { version = "0.1.0", path = "../../executor/wasm_common" }
casper-contract-macros = { version = "0.1.0", path = "../macros" }

once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

clap = { version = "4", optional = true, features = ["derive"] }
thiserror = { version = "1", optional = true }

cfg-if = "1.0.0"


[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rand = "0.8.5"
once_cell = "1.19.0"
linkme = "=0.3.29"

[features]
default = ["std"]
std = []

cli = ["clap", "thiserror"]
__abi_generator = ["casper-contract-macros/__abi_generator"]
__embed_schema = ["casper-contract-macros/__embed_schema"]
